[package]
name = "authenticator-rs"
version = "0.0.1"
license = "GPL-3,0-or-later"
description = "authenticator-rs"
readme = "README.md"
homepage = "https://github.com/grumlimited/authenticator-rs/"
repository = "https://github.com/grumlimited/authenticator-rs/"
authors = ["Romain Gallet <romain.gallet at gmail com>"]
edition = "2021"

[dependencies]
anyhow = "1"
async-channel = "2.2"
chrono = "0"
curl = "0"
directories = "6.0.0"
gdk = "0.19"
gdk-pixbuf = "0.22.0"
gettext-rs = {version = "0", features = ["gettext-system"]}
gio = "0.22.10"
gtk-macros = "0.3"
google_authenticator_converter = "0.2.0"
image = "0.25.8"
log = "0"
log4rs = "1"
refinery = { version = "0", features = ["rusqlite"]}
regex = "1"
rqrr = "0"
rusqlite = "0"
scraper = "0"
secret-service = { version = "5.1.0", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0"
strum = "0"
strum_macros = "0"
tempfile-fast = "0"
thiserror = "2.0.16"
totp-rs = { version = "6.0.0", features = ["steam"] }
uuid = { version = "1", features = ["v4"] }
base32 = "0.5.1"
percent-encoding = "2"
url = "2"

[dependencies.gtk]
version = "0.19.0"
features = ["v3_24"]

[dependencies.glib]
version = "0.22.10"

[dev-dependencies]
async-std = {version = "1", features = [] }
